{% extends 'base.html' %}
{% block content %}
<article class="content-section"><span class="badge bg-secondary">{{ post.category }}</span><h1 class="mt-2">{{ post.title }}</h1>
<p class="text-muted">Автор: {{ post.author }} | {{ post.posted.strftime('%d.%m.%Y %H:%M') }}</p>
<p class="post-content">{{ post.content }}</p>
<a class="btn btn-primary" href="{{ url_for('posts.update_post', post_id=post.id) }}">Edit</a>
<a class="btn btn-danger" href="{{ url_for('posts.delete_post', post_id=post.id) }}">Delete</a>
<a class="btn btn-outline-secondary" href="{{ url_for('posts.post_list') }}">Назад</a></article>
{% endblock %}
